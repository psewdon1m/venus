# Venus Platform - Stage Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.stage.yml up -d
# Requires IMAGE_REGISTRY (e.g. ghcr.io/org/venus) and IMAGE_TAG (e.g. stage-latest) to be set.

services:
  # ==================================================
  # Stage Database
  # ==================================================

  postgres:
    container_name: venus-stage-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-venus_stage}
      POSTGRES_USER: ${DATABASE_USER:-venus_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No port exposure - internal only
    networks:
      - data_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    container_name: venus-stage-redis
    image: redis:7-alpine
    restart: always
    command: >
      sh -c 'if [ -n "$REDIS_PASSWORD" ];
      then exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD";
      else exec redis-server --appendonly yes;
      fi'
    volumes:
      - redis_data:/data
    # No port exposure - internal only
    networks:
      - data_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ==================================================
  # Stage Services
  # ==================================================

  api-gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/api-gateway:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-api-gateway
    restart: always
    environment:
      NODE_ENV: stage
      LOG_LEVEL: debug
    ports:
      - "4000:4000"  # Exposed for testing
    networks:
      - frontend_net
      - backend_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/auth-service:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-auth-service
    restart: always
    environment:
      NODE_ENV: stage
      LOG_LEVEL: debug
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  project-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/project-service:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-project-service
    restart: always
    environment:
      NODE_ENV: stage
      LOG_LEVEL: debug
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  persona-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/persona-service:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-persona-service
    restart: always
    environment:
      NODE_ENV: stage
      LOG_LEVEL: debug
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  media-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/media-service:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-media-service
    restart: always
    environment:
      NODE_ENV: stage
      LOG_LEVEL: debug
    volumes:
      - ../../tmp/uploads:/tmp/uploads
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-cv-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/ai-cv-service:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-ai-cv-service
    restart: always
    environment:
      NODE_ENV: stage
      LOG_LEVEL: debug
    volumes:
      - ../../tmp/cv-generated:/tmp/cv-generated
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/venus/venus}/frontend:${IMAGE_TAG:-stage-latest}
    pull_policy: always
    container_name: venus-stage-frontend
    restart: always
    environment:
      NODE_ENV: stage
    ports:
      - "3000:3000"  # Exposed for testing
    networks:
      - frontend_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Stage Nginx (SSL Termination & Reverse Proxy)
  # ==================================================

  nginx:
    image: nginx:alpine
    container_name: venus-stage-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infrastructure/nginx/stage.nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - frontend_net
    depends_on:
      - frontend
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
