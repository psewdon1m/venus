# Venus Platform - Staging Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  # ==================================================
  # Staging Database
  # ==================================================

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-venus_staging}
      POSTGRES_USER: ${DATABASE_USER:-venus_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No port exposure - internal only
    networks:
      - data_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # No port exposure - internal only
    networks:
      - data_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ==================================================
  # Staging Services
  # ==================================================

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    ports:
      - "4000:4000"  # Exposed for testing
    networks:
      - frontend_net
      - backend_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  project-service:
    build:
      context: ../..
      dockerfile: services/project-service/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  persona-service:
    build:
      context: ../..
      dockerfile: services/persona-service/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  media-service:
    build:
      context: ../..
      dockerfile: services/media-service/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    volumes:
      - ../../tmp/uploads:/tmp/uploads
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-cv-service:
    build:
      context: ../..
      dockerfile: services/ai-cv-service/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
    volumes:
      - ../../tmp/cv-generated:/tmp/cv-generated
    networks:
      - backend_net
      - data_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_CDN_URL=${NEXT_PUBLIC_CDN_URL}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    restart: always
    environment:
      NODE_ENV: staging
    ports:
      - "3000:3000"  # Exposed for testing
    networks:
      - frontend_net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================================================
  # Staging Nginx (SSL Termination & Reverse Proxy)
  # ==================================================

  nginx:
    image: nginx:alpine
    container_name: venus-nginx-staging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infrastructure/nginx/staging.nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - frontend_net
    depends_on:
      - frontend
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
