# Venus Platform - Development Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ==================================================
  # Development Overrides
  # ==================================================

  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: venus_dev
    volumes:
      # Map local SQL scripts for hot-reload
      - ${COMPOSE_PROJECT_DIR}/infrastructure/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: services/api-gateway/Dockerfile.dev
      target: development
    volumes:
      # Hot reload source code
      - ${COMPOSE_PROJECT_DIR}/services/api-gateway/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/services/api-gateway/package.json:/app/package.json:cached
      - /app/node_modules
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
      WATCH_FILES: "true"
    command: npm run dev

  auth-service:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: services/auth-service/Dockerfile.dev
      target: development
    volumes:
      - ${COMPOSE_PROJECT_DIR}/services/auth-service/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/services/auth-service/package.json:/app/package.json:cached
      - /app/node_modules
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: npm run dev

  project-service:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: services/project-service/Dockerfile.dev
      target: development
    volumes:
      - ${COMPOSE_PROJECT_DIR}/services/project-service/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/services/project-service/package.json:/app/package.json:cached
      - /app/node_modules
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: npm run dev

  persona-service:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: services/persona-service/Dockerfile.dev
      target: development
    volumes:
      - ${COMPOSE_PROJECT_DIR}/services/persona-service/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/services/persona-service/package.json:/app/package.json:cached
      - /app/node_modules
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: npm run dev

  media-service:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: services/media-service/Dockerfile.dev
      target: development
    volumes:
      - ${COMPOSE_PROJECT_DIR}/services/media-service/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/services/media-service/package.json:/app/package.json:cached
      - /app/node_modules
      # Store uploads locally for dev
      - ${COMPOSE_PROJECT_DIR}/tmp/uploads:/tmp/uploads
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: npm run dev

  ai-cv-service:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: services/ai-cv-service/Dockerfile.dev
      target: development
    volumes:
      - ${COMPOSE_PROJECT_DIR}/services/ai-cv-service/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/services/ai-cv-service/package.json:/app/package.json:cached
      - /app/node_modules
      # Store generated PDFs locally for dev
      - ${COMPOSE_PROJECT_DIR}/tmp/cv-generated:/tmp/cv-generated
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: npm run dev

  frontend:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: frontend/Dockerfile.dev
      target: development
    volumes:
      # Hot reload Next.js
      - ${COMPOSE_PROJECT_DIR}/frontend/src:/app/src:cached
      - ${COMPOSE_PROJECT_DIR}/frontend/public:/app/public:cached
      - ${COMPOSE_PROJECT_DIR}/frontend/package.json:/app/package.json:cached
      - ${COMPOSE_PROJECT_DIR}/frontend/next.config.js:/app/next.config.js:cached
      - ${COMPOSE_PROJECT_DIR}/frontend/tsconfig.json:/app/tsconfig.json:cached
      - ${COMPOSE_PROJECT_DIR}/frontend/tailwind.config.ts:/app/tailwind.config.ts:cached
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: npm run dev

  # ==================================================
  # Development Tools
  # ==================================================

  # PostgreSQL Admin UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: venus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@venus.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - data_net
    depends_on:
      - postgres
    profiles:
      - dev-tools

  # Redis Commander UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: venus-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - data_net
    depends_on:
      - redis
    profiles:
      - dev-tools

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: venus-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - backend_net
    profiles:
      - dev-tools

volumes:
  pgadmin_data:
    name: venus-pgadmin-data
