# Venus Platform - Development Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ==================================================
  # Development Overrides
  # ==================================================

  postgres:
    container_name: venus-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: venus_dev
    volumes:
      # Map local SQL scripts for hot-reload
      - ../../infrastructure/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    container_name: venus-dev-redis
    ports:
      - "6379:6379"

  api-gateway:
    container_name: venus-dev-api-gateway
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
      target: development
    volumes:
      # Hot reload source code
      - ../../services/api-gateway/src:/workspace/services/api-gateway/src:cached
      - ../../services/api-gateway/package.json:/workspace/services/api-gateway/package.json:cached
      - ../../shared:/workspace/shared:cached
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
      WATCH_FILES: "true"
    command: ["pnpm", "dev"]

  auth-service:
    container_name: venus-dev-auth-service
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
      target: development
    volumes:
      - ../../services/auth-service/src:/workspace/services/auth-service/src:cached
      - ../../services/auth-service/package.json:/workspace/services/auth-service/package.json:cached
      - ../../shared:/workspace/shared:cached
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: ["pnpm", "dev"]

  project-service:
    container_name: venus-dev-project-service
    build:
      context: ../..
      dockerfile: services/project-service/Dockerfile
      target: development
    volumes:
      - ../../services/project-service/src:/workspace/services/project-service/src:cached
      - ../../services/project-service/package.json:/workspace/services/project-service/package.json:cached
      - ../../shared:/workspace/shared:cached
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: ["pnpm", "dev"]

  persona-service:
    container_name: venus-dev-persona-service
    build:
      context: ../..
      dockerfile: services/persona-service/Dockerfile
      target: development
    volumes:
      - ../../services/persona-service/src:/workspace/services/persona-service/src:cached
      - ../../services/persona-service/package.json:/workspace/services/persona-service/package.json:cached
      - ../../shared:/workspace/shared:cached
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: ["pnpm", "dev"]

  media-service:
    container_name: venus-dev-media-service
    build:
      context: ../..
      dockerfile: services/media-service/Dockerfile
      target: development
    volumes:
      - ../../services/media-service/src:/workspace/services/media-service/src:cached
      - ../../services/media-service/package.json:/workspace/services/media-service/package.json:cached
      - ../../shared:/workspace/shared:cached
      - ../../tmp/uploads:/tmp/uploads
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: ["pnpm", "dev"]

  ai-cv-service:
    container_name: venus-dev-ai-cv-service
    build:
      context: ../..
      dockerfile: services/ai-cv-service/Dockerfile
      target: development
    volumes:
      - ../../services/ai-cv-service/src:/workspace/services/ai-cv-service/src:cached
      - ../../services/ai-cv-service/package.json:/workspace/services/ai-cv-service/package.json:cached
      - ../../shared:/workspace/shared:cached
      - ../../tmp/cv-generated:/tmp/cv-generated
    environment:
      NODE_ENV: development
      DEBUG: "venus:*"
    command: ["pnpm", "dev"]

  frontend:
    container_name: venus-dev-frontend
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: development
    volumes:
      # Hot reload Next.js
      - ../../frontend/src:/workspace/frontend/src:cached
      - ../../frontend/public:/workspace/frontend/public:cached
      - ../../frontend/package.json:/workspace/frontend/package.json:cached
      - ../../frontend/next.config.ts:/workspace/frontend/next.config.ts:cached
      - ../../frontend/tsconfig.json:/workspace/frontend/tsconfig.json:cached
      - ../../frontend/tailwind.config.ts:/workspace/frontend/tailwind.config.ts:cached
      - /workspace/frontend/.next
    environment:
      NODE_ENV: development
    command: ["pnpm", "dev"]

  # ==================================================
  # Development Tools
  # ==================================================

  # PostgreSQL Admin UI
  pgadmin:
    container_name: venus-dev-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@venus.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - data_net
    depends_on:
      - postgres
    profiles:
      - dev-tools

  # Redis Commander UI
  redis-commander:
    container_name: venus-dev-redis-commander
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - data_net
    depends_on:
      - redis
    profiles:
      - dev-tools

  # Mailhog for email testing
  mailhog:
    container_name: venus-dev-mailhog
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - backend_net
    profiles:
      - dev-tools

volumes:
  pgadmin_data:
    name: venus-pgadmin-data
