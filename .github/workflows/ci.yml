name: CI

on:
  push:
    branches:
      - stage

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api-gateway, auth-service, project-service, persona-service, media-service, ai-cv-service]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @venus/auth-service exec prisma generate
          pnpm --filter @venus/project-service exec prisma generate
          pnpm --filter @venus/persona-service exec prisma generate
          pnpm --filter @venus/media-service exec prisma generate
          pnpm --filter @venus/ai-cv-service exec prisma generate

      - name: Run lint
        run: pnpm --filter ${{ matrix.service == 'frontend' && 'frontend' || format('@venus/{0}', matrix.service) }} lint

  db-integration:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && exit 0
            echo "Waiting for Postgres on localhost:5432 ($i/30)..."
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @venus/auth-service exec prisma generate
          pnpm --filter @venus/project-service exec prisma generate
          pnpm --filter @venus/persona-service exec prisma generate
          pnpm --filter @venus/media-service exec prisma generate
          pnpm --filter @venus/ai-cv-service exec prisma generate

      - name: Run database migrations
        run: pnpm --filter @venus/project-service migrate:dev
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test

      - name: Run integration tests (Postgres + Redis)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Run coverage suite
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    needs: db-integration
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: security-scan
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api-gateway, auth-service, project-service, persona-service, media-service, ai-cv-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=stage-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service == 'frontend' && 'frontend' || format('@venus/{0}', matrix.service) }}
            SERVICE_PATH=${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-allure:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    outputs:
      allure_ready: ${{ steps.allure-report-status.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @venus/auth-service exec prisma generate
          pnpm --filter @venus/project-service exec prisma generate
          pnpm --filter @venus/persona-service exec prisma generate
          pnpm --filter @venus/media-service exec prisma generate
          pnpm --filter @venus/ai-cv-service exec prisma generate

      - name: Prepare stage env file
        env:
          STAGE_SITE_DOMAIN: ${{ secrets.STAGE_SITE_DOMAIN }}
          STAGE_API_DOMAIN: ${{ secrets.STAGE_API_DOMAIN }}
          STAGE_CDN_DOMAIN: ${{ secrets.STAGE_CDN_DOMAIN }}
          STAGE_DATABASE_URL: ${{ secrets.STAGE_DATABASE_URL }}
          STAGE_DATABASE_INTERNAL_URL: ${{ secrets.STAGE_DATABASE_INTERNAL_URL }}
          STAGE_DATABASE_PASSWORD: ${{ secrets.STAGE_DATABASE_PASSWORD }}
          STAGE_REDIS_URL: ${{ secrets.STAGE_REDIS_URL }}
          STAGE_REDIS_PASSWORD: ${{ secrets.STAGE_REDIS_PASSWORD }}
          STAGE_JWT_SECRET: ${{ secrets.STAGE_JWT_SECRET }}
          STAGE_SESSION_SECRET: ${{ secrets.STAGE_SESSION_SECRET }}
          STAGE_ADMIN_PASSWORD: ${{ secrets.STAGE_ADMIN_PASSWORD }}
          STAGE_ADMIN_EMAIL: ${{ secrets.STAGE_ADMIN_EMAIL }}
          STAGE_S3_ACCESS_KEY: ${{ secrets.STAGE_S3_ACCESS_KEY }}
          STAGE_S3_SECRET_KEY: ${{ secrets.STAGE_S3_SECRET_KEY }}
          STAGE_OPENAI_API_KEY: ${{ secrets.STAGE_OPENAI_API_KEY }}
          STAGE_RESEND_API_KEY: ${{ secrets.STAGE_RESEND_API_KEY }}
          STAGE_SENTRY_DSN: ${{ secrets.STAGE_SENTRY_DSN }}
        run: |
          cp config/environments/.env.stage.example .env
          sed -i "s|{{STAGE_SITE_DOMAIN}}|${STAGE_SITE_DOMAIN}|g" .env
          sed -i "s|{{STAGE_API_DOMAIN}}|${STAGE_API_DOMAIN}|g" .env
          sed -i "s|{{STAGE_CDN_DOMAIN}}|${STAGE_CDN_DOMAIN}|g" .env
          sed -i "s|{{STAGE_DATABASE_URL}}|${STAGE_DATABASE_URL}|g" .env
          sed -i "s|{{STAGE_DATABASE_INTERNAL_URL}}|${STAGE_DATABASE_INTERNAL_URL}|g" .env
          sed -i "s|{{STAGE_DATABASE_PASSWORD}}|${STAGE_DATABASE_PASSWORD}|g" .env
          sed -i "s|{{STAGE_REDIS_URL}}|${STAGE_REDIS_URL}|g" .env
          sed -i "s|{{STAGE_REDIS_PASSWORD}}|${STAGE_REDIS_PASSWORD}|g" .env
          sed -i "s|{{STAGE_JWT_SECRET}}|${STAGE_JWT_SECRET}|g" .env
          sed -i "s|{{STAGE_SESSION_SECRET}}|${STAGE_SESSION_SECRET}|g" .env
          sed -i "s|{{STAGE_ADMIN_PASSWORD}}|${STAGE_ADMIN_PASSWORD}|g" .env
          sed -i "s|{{STAGE_ADMIN_EMAIL}}|${STAGE_ADMIN_EMAIL}|g" .env
          sed -i "s|{{STAGE_S3_ACCESS_KEY}}|${STAGE_S3_ACCESS_KEY}|g" .env
          sed -i "s|{{STAGE_S3_SECRET_KEY}}|${STAGE_S3_SECRET_KEY}|g" .env
          sed -i "s|{{STAGE_OPENAI_API_KEY}}|${STAGE_OPENAI_API_KEY}|g" .env
          sed -i "s|{{STAGE_RESEND_API_KEY}}|${STAGE_RESEND_API_KEY}|g" .env
          sed -i "s|{{STAGE_SENTRY_DSN}}|${STAGE_SENTRY_DSN}|g" .env

      - name: Start application stack
        run: |
          docker compose --env-file .env -f config/docker/docker-compose.yml -f config/docker/docker-compose.dev.yml up -d --build

      - name: Wait for API gateway
        run: |
          for attempt in {1..30}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              exit 0
            fi
            echo "Waiting for API gateway (attempt ${attempt})..."
            sleep 10
          done
          echo "API gateway failed to become healthy" >&2
          docker compose --env-file .env -f config/docker/docker-compose.yml -f config/docker/docker-compose.dev.yml ps
          exit 1

      - name: Apply database migrations
        run: pnpm --filter @venus/project-service migrate:dev
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/venus_dev

      - name: Run Playwright E2E suite
        run: pnpm test:e2e
        env:
          E2E_API_URL: http://127.0.0.1:4000/api
          E2E_TEST_PASSWORD: TestPass123!

      - name: Generate Allure report
        if: always()
        run: pnpm allure:report || true

      - name: Check Allure report directory
        if: always()
        id: allure-report-status
        run: |
          if [ -f allure-report/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Allure Pages artifact
        if: ${{ always() && steps.allure-report-status.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Upload Allure HTML
        if: ${{ always() && steps.allure-report-status.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - name: Print docker logs on failure
        if: failure()
        run: docker compose --env-file .env -f config/docker/docker-compose.yml -f config/docker/docker-compose.dev.yml logs

      - name: Stop application stack
        if: always()
        run: docker compose --env-file .env -f config/docker/docker-compose.yml -f config/docker/docker-compose.dev.yml down -v

  publish-allure:
    needs: e2e-allure
    if: ${{ always() && needs.e2e-allure.outputs.allure_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
