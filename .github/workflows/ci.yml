name: CI

on:
  push:
    branches:
      - stage

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api-gateway, auth-service, project-service, persona-service, media-service, ai-cv-service]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @venus/auth-service exec prisma generate
          pnpm --filter @venus/project-service exec prisma generate
          pnpm --filter @venus/persona-service exec prisma generate
          pnpm --filter @venus/media-service exec prisma generate
          pnpm --filter @venus/ai-cv-service exec prisma generate
          pnpm prisma:sync

      - name: Run lint
        run: pnpm --filter ${{ matrix.service == 'frontend' && 'frontend' || format('@venus/{0}', matrix.service) }} lint

  db-integration:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Wait for Postgres
        run: |
          PORT="5432"
          for i in {1..60}; do
            nc -z 127.0.0.1 "$PORT" && exit 0
            echo "Waiting for Postgres on 127.0.0.1:${PORT} ($i/60)..."
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @venus/auth-service exec prisma generate
          pnpm --filter @venus/project-service exec prisma generate
          pnpm --filter @venus/persona-service exec prisma generate
          pnpm --filter @venus/media-service exec prisma generate
          pnpm --filter @venus/ai-cv-service exec prisma generate
          pnpm prisma:sync

      - name: Run database migrations
        run: pnpm --filter @venus/project-service migrate:dev
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test

      - name: Run integration tests (Postgres + Redis)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Run coverage suite
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    needs: db-integration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          version: latest
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: security-scan
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api-gateway, auth-service, project-service, persona-service, media-service, ai-cv-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=stage-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service == 'frontend' && 'frontend' || format('@venus/{0}', matrix.service) }}
            SERVICE_PATH=${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
