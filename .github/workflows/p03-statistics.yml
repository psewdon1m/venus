name: Venus optional P03 statistics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p03-statistics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p03-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        section: [invariants, fairness, gf, inference]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: npm ci
      - run: npm run build
      - run: npm run test:p03:measurements -- --section=${{ matrix.section }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: p03-measurements-${{ matrix.section }}
          path: .artifacts/p03-measurements/
          if-no-files-found: error
