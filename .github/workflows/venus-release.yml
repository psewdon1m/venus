name: Venus qualified release
on:
  push:
    tags: ['venus-v*']
permissions:
  contents: read
concurrency:
  group: venus-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: venus-release
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .node-version}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12.14'}
      - name: Bind exact qualified tag to main
        env: {RELEASE_TAG: '${{ github.ref_name }}', RELEASE_SHA: '${{ github.sha }}'}
        run: node tools/venus-operator/check-release-context.mjs
      - run: python -m pip install --require-hashes -r tools/requirements.lock
      - run: npm ci
      - name: Existing quality and P06 gates before signing key
        run: npm run quality && node --test tests/p06/*.test.mjs tests/delivery/distribution.test.mjs tests/delivery/source-cache.test.mjs && node tools/p06-integration.mjs
      - name: Source-bound independent and all118 ID pre-sign gate
        run: node tools/venus-operator/release-gate.mjs .docs/implementation/evidence/p07/pre-sign-acceptance01/DECISION.json
      - name: Refuse existing immutable release
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ github.ref_name }}'}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
      - name: Registry authentication
        env: {GH_TOKEN: '${{ github.token }}'}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin
      - name: Build one immutable service image
        env: {RELEASE_TAG: '${{ github.ref_name }}', RELEASE_SHA: '${{ github.sha }}'}
        run: |
          VERSION="${RELEASE_TAG#venus-v}"
          docker buildx build --push --provenance=false --metadata-file .artifacts/p06-image-metadata.json --build-arg SOURCE_REVISION="$RELEASE_SHA" --build-arg RELEASE_VERSION="$VERSION" -f infra/venus/Dockerfile -t "ghcr.io/psewdon1m/venus:$RELEASE_TAG" .
      - name: Corresponding sources and notices for exact new image
        env: {RELEASE_SHA: '${{ github.sha }}'}
        run: |
          IMAGE="ghcr.io/psewdon1m/venus@$(node -p 'JSON.parse(require("fs").readFileSync(".artifacts/p06-image-metadata.json"))["containerimage.digest"]')"
          docker pull "$IMAGE"
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --user 1000:1000 --cpus 1 --memory 512m --tmpfs /tmp:size=32m,mode=1777 --mount type=bind,source="$GITHUB_WORKSPACE/tests/delivery",target=/app/tests/delivery,readonly --entrypoint node "$IMAGE" --test tests/delivery/poppler-boundary.test.mjs
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --cpus 1 --memory 512m --entrypoint node "$IMAGE" tools/delivery-inventory.mjs > .artifacts/delivery-inventory.json
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          PYTHON=python node tools/delivery-sources.mjs --inventory .artifacts/delivery-inventory.json --image "$IMAGE_ID" --source "$RELEASE_SHA" --output .artifacts/delivery-release
      - name: Prepare exact-image release inputs
        env: {RELEASE_TAG: '${{ github.ref_name }}', RELEASE_SHA: '${{ github.sha }}'}
        run: python -B tools/p06_release_inputs.py
      - name: Exact built-image install and release check before signature
        run: node tools/p06-integration.mjs --release-candidate .artifacts/p06-service-candidate.json
      - name: Sign prepared exact bytes
        env:
          VENUS_RELEASE_PRIVATE_KEY: ${{ secrets.VENUS_RELEASE_PRIVATE_KEY }}
        run: |
          umask 077
          test -n "$VENUS_RELEASE_PRIVATE_KEY"
          trap 'rm -f "$RUNNER_TEMP/venus-signing.pem"' EXIT
          printf '%s' "$VENUS_RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/venus-signing.pem"
          node tools/venus-operator/create-release.mjs .artifacts/p06-service-candidate.json
      - name: Draft immutable assets
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ github.ref_name }}'}
        run: gh release create "$RELEASE_TAG" .artifacts/p06-service-release/* --draft --title "$RELEASE_TAG" --notes 'Standalone local-pilot Venus release; production deployment is not authorized.'
      - name: Verify published draft bytes
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ github.ref_name }}'}
        run: |
          mkdir -p .artifacts/p06-published-roundtrip
          gh release download "$RELEASE_TAG" --dir .artifacts/p06-published-roundtrip
          node tools/venus-operator/verify-published.mjs .artifacts/p06-service-candidate.json .artifacts/p06-published-roundtrip
      - name: Publish local-pilot prerelease without production latest alias
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ github.ref_name }}'}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Anonymous external signed-asset smoke
        run: node tools/venus-operator/verify-published.mjs .artifacts/p06-service-candidate.json .artifacts/p06-published-roundtrip --anonymous
      - name: Preserve public release verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: p06-qualified-release-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            .artifacts/p06/
            .artifacts/p06-service-candidate.json
            .artifacts/p06-image-metadata.json
            .artifacts/p06-service-release/
            .artifacts/p06-published-roundtrip/
            .artifacts/p06-published-roundtrip.anonymous/
            .artifacts/delivery-release/SOURCE-INDEX.json
            .artifacts/delivery-release/THIRD-PARTY-NOTICES.md
            .artifacts/delivery-release/SOURCES-RECEIPT.json
