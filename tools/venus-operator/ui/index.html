<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venus — обслуживание</title><link rel="stylesheet" href="/operator.css"></head><body><main><h1>Обслуживание Venus</h1><p>Локальная панель оператора. Обновление приостанавливает работу сервиса; перед изменениями сохраняется полная резервная копия.</p><form id="login"><label>Ключ оператора <input id="credential" type="password" autocomplete="off"></label><label>Или файл ключа (точные байты, включая переводы строк) <input id="credential-file" type="file"></label><button>Подключиться</button></form><section id="controls" hidden><p id="current"></p><label>Проверенный выпуск <select id="release"></select></label><button id="create">Подготовить обновление</button><p id="job" aria-live="polite"></p><div class="actions"><button id="confirm">Подтвердить выпуск</button><button id="apply">Применить</button><button id="cancel">Отменить до установки</button><button id="recover">Восстановить незавершённое обновление</button></div><p>Восстановление сохраняет новые удаления и отзывы доступа. При недоказанном безопасном исходе сервис останется закрытым.</p><pre id="events" aria-label="Журнал обновления"></pre><button id="logout">Отключиться</button></section><p id="error" role="alert"></p></main><script type="module" src="/operator.js"></script></body></html>
