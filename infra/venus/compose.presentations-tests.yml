services:
  browser:
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    environment:
      VENUS_PRESENTATIONS_ENABLED: "true"
      VENUS_PRESENTATIONS_SPOOL: /run/venus-presentations/spool
    volumes:
      - presentation-spool:/run/venus-presentations/spool
  presentation-renderer:
    image: ${VENUS_P05_IMAGE:?Set exact local test image ID}
    user: "0:0"
    init: false
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 32
    command: [/usr/bin/python3, -I, -B, /app/infra/venus/presentation-guardian.py]
    tmpfs: ["/run/venus-presentations/scratch:size=64m,nr_inodes=1024,uid=65534,gid=65534,mode=0700,noexec,nosuid,nodev", "/var/lib/venus:size=4k,nr_inodes=1,mode=0000,ro,noexec,nosuid,nodev"]
    volumes:
      - presentation-spool:/run/venus-presentations/spool
    stop_grace_period: 15s
volumes:
  presentation-spool:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,nr_inodes=1024,uid=1000,gid=1000,mode=1777,noexec,nosuid,nodev
